services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/dbname
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
    name: embedded-app-postgres-data
